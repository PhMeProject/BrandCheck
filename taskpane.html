<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrandCheck</title>

  <!-- Office.js must load before any add-in code runs. -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>

  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>

  <div id="app">
    <header class="header">
      <h1 class="header__title">BrandCheck</h1>
      <p class="header__subtitle">Brand &amp; style linter</p>
    </header>

    <main class="main">
      <button id="btn-check" class="btn btn--primary">Brand Check</button>

      <div id="status" class="status" aria-live="polite"></div>

      <section id="results" class="results" aria-label="Violations">
        <!-- Violation cards are injected here by taskpane.js -->
      </section>
    </main>
  </div>

  <script src="taskpane.js"></script>
</body>
</html>
