<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrandCheck</title>

  <!-- Office.js must load before any add-in code runs. -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>

  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>

<div id="app">

  <header class="header">
    <div class="header__inner">
      <div>
        <h1 class="header__title">BrandCheck</h1>
        <p class="header__subtitle">Brand &amp; style linter</p>
      </div>
      <button id="btn-open-settings" class="btn-icon" aria-label="Open settings" title="Settings">&#9881;</button>
    </div>
  </header>

  <!-- ── Checker view ──────────────────────────────────────── -->
  <main id="view-checker" class="view">
    <div class="view__inner">
      <button id="btn-check" class="btn btn--primary">Check Document</button>
      <div id="status" class="status" aria-live="polite"></div>
      <section id="results" class="results" aria-label="Violations"></section>
    </div>
  </main>

  <!-- ── Settings view ────────────────────────────────────── -->
  <div id="view-settings" class="view hidden" role="region" aria-label="Brand rule settings">
    <div class="view__inner">

      <div class="settings-header">
        <button id="btn-close-settings" class="btn-icon" aria-label="Back" title="Back">&#8592;</button>
        <h2 class="settings-title">Brand Rules</h2>
      </div>

      <p class="settings-hint">Leave a field blank / unchecked to skip that rule.</p>

      <!-- Font name -->
      <div class="field">
        <label class="field__label" for="s-font-name">Required font name</label>
        <input type="text" id="s-font-name" class="field__input"
               placeholder="e.g. Calibri" autocomplete="off" spellcheck="false" />
      </div>

      <!-- Font size -->
      <div class="field">
        <label class="field__label" for="s-font-size">Required font size (pt)</label>
        <input type="number" id="s-font-size" class="field__input"
               min="6" max="96" step="0.5" placeholder="e.g. 11" />
      </div>

      <!-- Allowed colors -->
      <div class="field">
        <label class="field__label">Allowed font colors</label>
        <p class="field__hint">Add at least one color to enable color checking.</p>
        <div id="color-list" class="color-list"></div>
        <button type="button" id="btn-add-color" class="btn btn--sm btn--outline">+ Add color</button>
      </div>

      <!-- Typography constraints -->
      <div class="field">
        <label class="field__label">Typography constraints</label>
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="s-allow-bold" />
            <span>Bold permitted</span>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="s-allow-italic" />
            <span>Italic permitted</span>
          </label>
        </div>
      </div>

      <button type="button" id="btn-save-settings" class="btn btn--primary">Save Settings</button>
      <div id="settings-status" class="status" aria-live="polite"></div>

    </div>
  </div>

</div>

<script src="taskpane.js"></script>
</body>
</html>
